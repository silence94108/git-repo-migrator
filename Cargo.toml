[workspace]
resolver = "2"
members = ["crates/domain", "crates/local-store", "crates/git-runner", "crates/workspace", "apps/desktop/src-tauri"]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
