[package]
name = "git-repo-migrator-http-transport"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-trait = "0.1"
git-repo-migrator-credential-store = { path = "../credential-store" }
git-repo-migrator-platform-core = { path = "../platform-core" }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "gzip", "http2", "system-proxy", "socks"] }
rustls = { version = "0.23", default-features = false }
rustls-platform-verifier = "0.7"
sha2 = "0.10"
tokio = { version = "1", features = ["time"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "time"] }

[lints]
workspace = true
